<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>TCM NFT • Ecosystem Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap');

        :root {
            --primary: #00f5ff; 
            --bg-dark-blue: #0b1120; 
            --bg-deep-dark: #030305; 
            --bg-card: rgba(13, 15, 28, 0.65); 
            --text-main: #f8f9fc; 
            --text-sub: #64748b;
            --border-light: rgba(255, 255, 255, 0.15); 
            --border-dark: rgba(255, 255, 255, 0.02);
            --shadow-heavy: rgba(0,0,0,0.9);
            --error: #f43f5e;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; scrollbar-width: none !important; }
        *::-webkit-scrollbar { display: none !important; width: 0 !important; background: transparent !important; }
        html, body { width: 100%; background-color: var(--bg-dark-blue); color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; overflow-y: auto; scroll-behavior: smooth; }
        
        body { 
            background: linear-gradient(135deg, var(--bg-dark-blue) 0%, var(--bg-deep-dark) 100%); 
            background-attachment: fixed; min-height: 120vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            padding-top: calc(env(safe-area-inset-top) + 100px); 
            padding-bottom: calc(env(safe-area-inset-bottom) + 100px); 
        }

        .header-top { 
            position: fixed; top: 0; left: 0; width: 100%; 
            padding: 10px 20px 15px; 
            padding-top: calc(env(safe-area-inset-top) + 15px) !important;
            display: flex; align-items: center; justify-content: space-between; 
            background: rgba(3, 3, 5, 0.85); backdrop-filter: blur(25px); 
            z-index: 1000; border-bottom: 1px solid var(--border-dark); 
            box-shadow: 0 10px 30px var(--shadow-heavy); 
        }
        .logo-box { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.1rem; background: linear-gradient(90deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; filter: drop-shadow(0 0 5px rgba(0,245,255,0.3)); white-space: nowrap; }
        .crypto-ticker { flex: 1; overflow: hidden; margin: 0 15px; display: flex; align-items: center; white-space: nowrap; -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent); }
        .ticker-track { display: inline-block; animation: scrollTicker 20s linear infinite; }
        @keyframes scrollTicker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .t-item { display: inline-flex; align-items: center; gap: 5px; font-size: 0.7rem; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.03); padding: 5px 10px; border-radius: 12px; margin-right: 10px; font-weight: 600; }
        .header-login-txt { display: flex; gap: 2px; font-family: 'Space Grotesk'; font-size: 0.85rem; font-weight: 800; cursor: pointer; }
        .header-login-txt span { display: inline-block; color: rgba(255,255,255,0.5); animation: periodicWave 6s infinite; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .header-login-txt span:nth-child(1) { animation-delay: 0.0s; } .header-login-txt span:nth-child(2) { animation-delay: 0.1s; } .header-login-txt span:nth-child(3) { animation-delay: 0.2s; } .header-login-txt span:nth-child(4) { animation-delay: 0.3s; } .header-login-txt span:nth-child(5) { animation-delay: 0.4s; } .header-login-txt span:nth-child(6) { animation-delay: 0.5s; }
        @keyframes periodicWave { 0%, 15%, 100% { transform: scale(1) translateY(0); color: rgba(255,255,255,0.5); text-shadow: none; } 7.5% { transform: scale(1.4) translateY(-3px); color: #fff; text-shadow: 0 0 12px #fff, 0 0 20px var(--primary); } }
        
        .login-container { position: relative; width: 100%; max-width: 440px; margin: auto; padding: 0 20px; z-index: 10; animation: floatContainer 6s ease-in-out infinite; }
        @keyframes floatContainer { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .form-pill { position: relative; background: var(--bg-card); backdrop-filter: blur(40px); border-radius: 40px; padding: 50px 25px 40px; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-dark); box-shadow: 0 25px 60px var(--shadow-heavy), inset 0 5px 20px rgba(255,255,255,0.03); text-align: center; }
        .logo-mark { font-size: 3rem; color: var(--primary); margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(0,245,255,0.4)); animation: floatLogo 4s ease-in-out infinite; }
        @keyframes floatLogo { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.05); filter: drop-shadow(0 0 25px rgba(0,245,255,0.6)); } }
        .pill-title { font-family: 'Space Grotesk'; font-size: 1.5rem; font-weight: 800; margin-bottom: 30px; color: #fff; letter-spacing: 1px; }

        .input-wrapper { position: relative; margin-bottom: 20px; }
        .input-wrapper i.left-i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 1.1rem; transition: 0.3s; z-index: 2; pointer-events: none; }
        .input-wrapper input { width: 100%; padding: 18px 15px 18px 50px; background: #05060a; border: none; border-radius: 35px; color: #fff; outline: none; transition: 0.4s; font-size: 0.95rem; box-shadow: -1px -1px 2px rgba(255,255,255,0.05), 2px 2px 5px rgba(0,0,0,0.8), inset 2px 2px 10px rgba(0,0,0,0.9); }
        .input-wrapper input:focus { box-shadow: inset 2px 2px 12px rgba(0,0,0,0.9), 0 0 15px rgba(0, 245, 255, 0.15); border: 1px solid rgba(0, 245, 255, 0.3); color: #fff; }
        .input-wrapper input:focus + i.left-i { color: var(--primary); filter: drop-shadow(0 0 5px var(--primary)); }
        .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; background: #0a0a15; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8); z-index: 3; transition: 0.3s;}

        .row-options { display: flex; justify-content: space-between; align-items: center; margin-top: -5px; margin-bottom: 20px; padding: 0 10px; }
        .remember-label { display: flex; align-items: center; gap: 8px; color: var(--text-sub); font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .remember-label input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
        .ghost-touch-text { background: linear-gradient(90deg, #64748b 0%, #00f5ff 50%, #64748b 100%); background-size: 200% auto; color: transparent; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: ghostSwipe 3s linear infinite; cursor: pointer; font-size: 0.85rem; font-weight: 700; text-decoration: none; }
        @keyframes ghostSwipe { 0% { background-position: -100% center; } 100% { background-position: 100% center; } }

        .btn-login { width: 100%; padding: 18px; border-radius: 35px; font-weight: 800; font-size: 1rem; letter-spacing: 1px; border: none; position: relative; overflow: hidden; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-disabled { background: #0f1524; color: #334155; cursor: not-allowed; box-shadow: inset 3px 3px 10px rgba(0,0,0,0.8); }
        .btn-active { background: linear-gradient(135deg, var(--primary), #0284c7); color: #020617; cursor: pointer; box-shadow: 0 10px 25px rgba(0, 245, 255, 0.3); }

        .social-ghost-box { margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 25px; border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 2px 2px 10px rgba(0,0,0,0.5); }
        .s-icon { color: var(--text-sub); font-size: 1.3rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: ghostTouchDark 6s infinite; }
        .s-icon:nth-child(1) { animation-delay: 0s; } .s-icon:nth-child(2) { animation-delay: 0.5s; } .s-icon:nth-child(3) { animation-delay: 1s; } .s-icon:nth-child(4) { animation-delay: 1.5s; }
        @keyframes ghostTouchDark { 0%, 100% { transform: scale(1); text-shadow: none; color: var(--text-sub); } 5% { transform: scale(1.15); text-shadow: 0 0 12px rgba(0, 245, 255, 0.8), 0 0 6px #ffffff; color: #ffffff; } 15% { transform: scale(1); text-shadow: none; color: var(--text-sub); } }
        
        .signup-link { margin-top: 25px; font-size: 0.85rem; color: var(--text-sub); font-weight: 500; display: block; }
        .footer-nav { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 30px); left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 50px; background: var(--bg-card); backdrop-filter: blur(40px); border-radius: 30px; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-dark); box-shadow: 0 10px 30px var(--shadow-heavy), inset 0 5px 15px rgba(255,255,255,0.02); display: flex; justify-content: space-evenly; align-items: center; z-index: 1000; font-size: 0.75rem; font-weight: 700; color: var(--text-sub); letter-spacing: 1px; }

        /* 🔥 MAGIC PORTAL 🔥 */
        #magicPortal { position: fixed; inset: 0; background: rgba(3, 3, 5, 0.90); z-index: 10000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.5s ease; backdrop-filter: blur(20px); }
        #magicPortal.active { opacity: 1; }
        .magic-box { position: relative; background: var(--bg-card); backdrop-filter: blur(40px); border: 1px solid var(--border-light); border-radius: 30px; padding: 65px 30px 30px; text-align: center; transform: scale(0.8); opacity: 0; transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 25px 60px var(--shadow-heavy), inset 0 5px 20px rgba(255,255,255,0.05); width: 90%; max-width: 360px; }
        .magic-box.show { transform: scale(1); opacity: 1; }
        .m-avatar-wrapper { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); width: 100px; height: 100px; border-radius: 50%; background: #0b1120; padding: 4px; box-shadow: 0 -10px 25px rgba(0,245,255,0.2), inset 0 5px 15px rgba(255,255,255,0.05), 0 10px 20px rgba(0,0,0,0.8); z-index: 2; }
        .m-avatar { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        .m-name { font-family: 'Space Grotesk'; font-size: 2.2rem; font-weight: 800; color: #fff; margin-bottom: 25px; text-shadow: 0 0 20px rgba(255,255,255,0.4); }
        .m-profit-box { background: rgba(0,0,0,0.5); border: 1px solid rgba(0,245,255,0.2); padding: 15px 30px; border-radius: 20px; display: inline-block; box-shadow: inset 0 0 20px rgba(0,245,255,0.1), 0 10px 30px rgba(0,0,0,0.5); }
        .m-profit-val { font-size: 1.8rem; font-weight: 800; color: var(--primary); font-family: 'Space Grotesk', monospace; display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 140px; }

        /* 🔥 FORGOT PASSWORD MODAL 🔥 */
        #forgotModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: 0.3s; }
        #forgotModal.show { opacity: 1; }
        .forgot-box { background: rgba(13, 15, 28, 0.85); backdrop-filter: blur(40px); width: 100%; max-width: 380px; border-radius: 30px; padding: 30px; text-align: center; border: 1px solid var(--primary); box-shadow: 0 20px 50px rgba(0, 245, 255, 0.15), inset 0 5px 20px rgba(255,255,255,0.05); transform: scale(0.9); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #forgotModal.show .forgot-box { transform: scale(1); }
        .fg-input { width: 100%; padding: 15px; background: #05060a; border: none; border-radius: 15px; margin-bottom: 12px; color: #fff; outline: none; font-size: 0.95rem; box-shadow: inset 2px 2px 10px rgba(0,0,0,0.9), -1px -1px 2px rgba(255,255,255,0.05); transition: 0.3s;}
        .fg-input:focus { box-shadow: inset 2px 2px 12px rgba(0,0,0,0.9), 0 0 15px rgba(0, 245, 255, 0.15); border: 1px solid rgba(0, 245, 255, 0.3); }
        .fg-btn { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: #fff; font-weight: 800; cursor: pointer; margin-bottom: 15px; transition: 0.3s; box-shadow: inset 2px 2px 5px rgba(255,255,255,0.1), 4px 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .fg-btn:hover { background: rgba(255,255,255,0.1); box-shadow: inset 2px 2px 10px rgba(255,255,255,0.2), 0 5px 20px rgba(0,0,0,0.6); transform: translateY(-2px); }
        .fg-btn-success { background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05)); border: 1px solid rgba(16, 185, 129, 0.5); color: #10b981; box-shadow: inset 2px 2px 10px rgba(16, 185, 129, 0.2), 0 8px 20px rgba(0,0,0,0.6); }
        .fg-btn-success:hover { background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(16, 185, 129, 0.1)); color: #fff; box-shadow: inset 2px 2px 15px rgba(16, 185, 129, 0.4), 0 10px 25px rgba(16, 185, 129, 0.4); transform: translateY(-2px); }
        
        @media (max-width: 450px) { .logo-box { font-size: 0.95rem; } .header-login-txt { font-size: 0.75rem; gap: 1px; } .crypto-ticker { margin: 0 5px; } .form-pill { padding: 40px 20px 30px; } .m-name { font-size: 1.8rem; } }
    </style>
</head>
<body>

    <header class="header-top">
        <div class="logo-box" onclick="window.location.href='Signup.html'"><i class="fas fa-cube"></i> TCM NFT</div>
        <div class="crypto-ticker">
            <div class="ticker-track">
                <div class="t-item">BTC <span style="color:#10b981">$64,230</span></div>
                <div class="t-item">ETH <span style="color:#f43f5e">$3,450</span></div>
                <div class="t-item">BNB <span style="color:#10b981">$580.40</span></div>
            </div>
        </div>
        <div class="header-login-txt" onclick="window.location.href='Signup.html'">
            <span>S</span><span>I</span><span>G</span><span>N</span><span>U</span><span>P</span>
        </div>
    </header>

    <div class="login-container">
        <div class="form-pill">
            <i class="fas fa-fingerprint logo-mark"></i>
            <div class="pill-title">ACCESS ECOSYSTEM</div>

            <form id="loginForm">
                <div class="input-wrapper">
                    <i class="fas fa-user left-i"></i>
                    <input type="text" id="loginUID" placeholder="Email or UID" autocomplete="username" required>
                </div>

                <div class="input-wrapper">
                    <i class="fas fa-lock left-i"></i>
                    <input type="password" id="loginPass" placeholder="Security Key" autocomplete="current-password" required>
                    <div class="eye-btn" id="togglePassBtn">
                        <i class="far fa-eye" id="eyeIcon" style="color:var(--text-sub); font-size:1.1rem;"></i>
                    </div>
                </div>

                <div class="row-options">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe"> Remember Me
                    </label>
                    <a href="javascript:void(0)" id="openForgotBtn" class="ghost-touch-text" onclick="document.getElementById('forgotModal').style.display='flex'; setTimeout(()=>document.getElementById('forgotModal').classList.add('show'),10);">
    Forgot Password?
</a>
                </div>

                <div id="errorBox" style="display: none; margin-bottom: 10px;">
                    <p id="errorTxt" style="color: #ff4c4c; font-size: 0.85rem; font-weight: bold;"></p>
                </div>

                <button type="submit" class="btn-login btn-disabled" id="loginBtn" disabled>
                    <span id="btnText">SECURE LOGIN</span>
                </button>
            </form>

            <div class="social-ghost-box">
                <i class="fab fa-x-twitter s-icon x"></i>
                <i class="fab fa-telegram s-icon tg"></i>
                <i class="fab fa-youtube s-icon yt"></i>
                <i class="fas fa-envelope s-icon gm"></i>
            </div>

            <span class="signup-link">
                New to Ecosystem? <a href="Signup.html" style="color: var(--primary); text-decoration: none; font-weight: 800;">JOIN NOW</a>
            </span>
        </div>
    </div>

    <nav class="footer-nav">
        <span>PRIVACY</span> • <span>TERMS</span> • <span>SUPPORT</span>
    </nav>

    <div id="magicPortal">
        <div class="magic-box" id="magicBox">
            <div class="m-avatar-wrapper">
                <img src="" id="pAvatar" class="m-avatar">
            </div>
            <div style="font-size: 0.9rem; color: var(--text-sub); font-weight: 600;">Welcome Back</div>
            <div class="m-name" id="pName">Loading...</div>
            <div class="m-profit-box">
                <div style="font-size:0.7rem; color:var(--text-sub); text-transform:uppercase;">Comp Profit</div>
                <div class="m-profit-val" id="pProfit">0.00 <span style="color:#fff;">₮</span></div>
            </div>
            <div style="margin-top:25px; font-size:0.85rem; font-weight:600; color:var(--primary);"><i class="fas fa-spinner fa-spin"></i> Entering Dashboard...</div>
        </div>
    </div>

    <div id="forgotModal">
        <div class="forgot-box">
            <h2 style="color: #fff; margin-bottom: 10px; font-family: 'Space Grotesk';"><i class="fas fa-unlock-alt" style="color:var(--primary);"></i> Reset Password</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 15px;">Enter your registered email to receive OTP.</p>
            
            <p id="forgotErrorTxt" style="color: var(--error); font-size: 0.85rem; font-weight: 700; margin-bottom: 15px; min-height: 18px;"></p>

            <input type="email" id="resetEmail" class="fg-input" placeholder="Registered Email ID">
            <button id="btnSendResetOTP" class="fg-btn">Send Recovery OTP</button>

            <div id="resetOtpArea" style="display: none;">
                <input type="number" id="resetOTP" class="fg-input" placeholder="Enter 6-digit OTP">
                <input type="password" id="resetNewPass" class="fg-input" placeholder="Create New Password">
                <button id="btnConfirmReset" class="fg-btn fg-btn-success">Confirm Password</button>
            </div>

            <p id="closeForgotBtn" onclick="document.getElementById('forgotModal').classList.remove('show'); setTimeout(()=>document.getElementById('forgotModal').style.display='none',300);" style="color: var(--error); font-size: 0.85rem; cursor: pointer; font-weight: 700; margin-top: 10px;">Cancel & Close</p>
        </div>
    </div>
    
<script>
// ==============================================================
// DOM Mapping & Initial Setup
// ==============================================================
const loginForm = document.getElementById('loginForm');
const loginUID = document.getElementById('loginUID');
const loginPass = document.getElementById('loginPass');
const loginBtn = document.getElementById('loginBtn');
const btnText = document.getElementById('btnText');
const rememberMe = document.getElementById('rememberMe');
const errorBox = document.getElementById('errorBox');
const errorTxt = document.getElementById('errorTxt');
const togglePassBtn = document.getElementById('togglePassBtn');
const eyeIcon = document.getElementById('eyeIcon');

const magicPortal = document.getElementById('magicPortal');
const magicBox = document.getElementById('magicBox');
const pAvatar = document.getElementById('pAvatar');
const pName = document.getElementById('pName');
const pProfit = document.getElementById('pProfit');

const openForgotBtn = document.getElementById('openForgotBtn');
const closeForgotBtn = document.getElementById('closeForgotBtn');
const forgotModal = document.getElementById('forgotModal');
const resetEmail = document.getElementById('resetEmail');
const btnSendResetOTP = document.getElementById('btnSendResetOTP');
const resetOtpArea = document.getElementById('resetOtpArea');
const resetOTP = document.getElementById('resetOTP');
const resetNewPass = document.getElementById('resetNewPass');
const btnConfirmReset = document.getElementById('btnConfirmReset');
const forgotErrorTxt = document.getElementById('forgotErrorTxt');

if (loginBtn) {
    loginBtn.disabled = true;
    loginBtn.classList.add('btn-disabled');
}

// ==============================================================
// Utilities & Validation
// ==============================================================
function showError(msg) {
    if (errorBox && errorTxt) {
        errorTxt.innerText = msg;
        errorBox.style.display = 'block';
    } else alert(msg);
}

function hideError() {
    if (errorBox) errorBox.style.display = 'none';
}

function validateLoginInput() {
    const uidValid = loginUID?.value.trim().length > 0;
    const passValid = loginPass?.value.length >= 6;
    
    if (loginBtn) {
        loginBtn.disabled = !(uidValid && passValid);
        if (loginBtn.disabled) {
            loginBtn.classList.remove('btn-active');
            loginBtn.classList.add('btn-disabled');
        } else {
            loginBtn.classList.remove('btn-disabled');
            loginBtn.classList.add('btn-active');
        }
    }
}

if (loginUID) {
    loginUID.addEventListener('input', validateLoginInput);
    loginUID.addEventListener('change', validateLoginInput);
}
if (loginPass) {
    loginPass.addEventListener('input', validateLoginInput);
    loginPass.addEventListener('change', validateLoginInput);
}

// Password Toggle
if (togglePassBtn && loginPass) {
    togglePassBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (loginPass.type === 'password') {
            loginPass.type = 'text';
            if (eyeIcon) {
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
                eyeIcon.style.color = "var(--primary, #f3ba2f)";
            }
        } else {
            loginPass.type = 'password';
            if (eyeIcon) {
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
                eyeIcon.style.color = "var(--text-sub, #888)";
            }
        }
    });
}

// Remember Me Data
window.addEventListener('DOMContentLoaded', () => {
    const remUID = localStorage.getItem('tcm_rem_uid');
    const remPass = localStorage.getItem('tcm_rem_pass');
    
    if (remUID && remPass) {
        if (loginUID) loginUID.value = remUID;
        if (loginPass) loginPass.value = remPass;
        if (rememberMe) rememberMe.checked = true;
        validateLoginInput();
    }
});

// Magic Portal Animation
function animateProfitValue(obj, start, end, duration) {
    let startTimestamp = null;
    const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const easeProgress = 1 - Math.pow(1 - progress, 4);
        const currentVal = (easeProgress * (end - start) + start).toFixed(2);
        
        obj.innerHTML = `${currentVal} <span style="color:#fff;">₮</span>`;
        obj.style.color = '#ffffff';
        obj.style.textShadow = '0 0 15px rgba(0, 245, 255, 0.8)';

        if (progress < 1) {
            window.requestAnimationFrame(step);
        } else {
            obj.innerHTML = `${end.toFixed(2)} <span style="color:#fff;">₮</span>`;
            obj.style.color = 'var(--primary)';
            obj.style.textShadow = '0 0 25px rgba(0, 245, 255, 1), 0 0 10px rgba(255, 255, 255, 0.8)';
            setTimeout(() => { obj.style.textShadow = 'none'; }, 500);
        }
    };
    window.requestAnimationFrame(step);
}

// ==============================================================
// 🚀 Main Login Core Logic (API Call to Backend)
// ==============================================================
let isLoggingIn = false;

async function handleLoginRequest() {
    if (isLoggingIn) return; 
    isLoggingIn = true;
    
    hideError();
    const identifier = loginUID.value.trim();
    const password = loginPass.value;
    const isEmail = identifier.includes('@');

    loginBtn.disabled = true;
    loginBtn.classList.remove('btn-active');
    loginBtn.classList.add('btn-disabled');
    if (btnText) btnText.innerText = "Authenticating...";

    try {
        const payload = { identifier, password, isEmail };

        // ব্যাকএন্ডে API কল করা হচ্ছে
        const response = await fetch('http://127.0.0.1:5000/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Login failed. Please try again.");
        }

        // লোকাল স্টোরেজে ডেটা সেভ করা
        localStorage.setItem("uid", result.uid);
        localStorage.setItem("token", result.token);
        localStorage.setItem("name", result.name);
        localStorage.setItem("email", result.email);
        
        if (result.avatar) {
            localStorage.setItem("tcm_user_dp", result.avatar);
        } else {
            localStorage.removeItem("tcm_user_dp");
        }

        if (rememberMe && rememberMe.checked) {
            localStorage.setItem("tcm_rem_uid", identifier);
            localStorage.setItem("tcm_rem_pass", password);
        } else {
            localStorage.removeItem("tcm_rem_uid");
            localStorage.removeItem("tcm_rem_pass");
        }

        // Magic Portal দেখানো
        if (pAvatar && result.avatar) pAvatar.src = result.avatar;
        if (pName) pName.innerText = result.name;
        
        if (pProfit) {
            animateProfitValue(pProfit, 0, result.totalComp, 1500);
        }

        if (magicPortal) {
            magicPortal.style.display = "flex";
            setTimeout(() => magicPortal.classList.add("active"), 10);
        }
        if (magicBox) magicBox.classList.add("show");

        setTimeout(() => {
            window.location.href = "Dashboard.html";
        }, 3000);

    } catch (error) {
        console.error("Login Error:", error);
        showError(error.message);
        
        isLoggingIn = false;
        loginBtn.disabled = false;
        loginBtn.classList.remove('btn-disabled');
        loginBtn.classList.add('btn-active');
        if (btnText) btnText.innerText = "SECURE LOGIN";
    }
}

if (loginBtn) {
    loginBtn.addEventListener('click', (e) => {
        e.preventDefault();
        handleLoginRequest();
    });
}
if (loginForm) {
    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        handleLoginRequest();
    });
}

// ==============================================================
// 🚀 Forgot Password Flow (API Calls to Backend)
// ==============================================================
let currentResetUID = null;

if (openForgotBtn) {
    openForgotBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (forgotModal) {
            forgotModal.style.display = 'flex';
            setTimeout(() => forgotModal.classList.add("show"), 10);
        }
    });
}

if (closeForgotBtn) {
    closeForgotBtn.addEventListener('click', () => {
        if (forgotModal) {
            forgotModal.classList.remove("show");
            setTimeout(() => { forgotModal.style.display = 'none'; }, 300);
        }
        if (resetOtpArea) resetOtpArea.style.display = 'none';
        if (resetEmail) resetEmail.value = '';
        if (resetOTP) resetOTP.value = '';
        if (resetNewPass) resetNewPass.value = '';
        if (forgotErrorTxt) forgotErrorTxt.innerText = '';
        if (btnSendResetOTP) btnSendResetOTP.innerText = 'Send Recovery OTP';
        if (btnConfirmReset) btnConfirmReset.innerText = 'Confirm Reset';
        currentResetUID = null;
    });
}

// OTP সেন্ড করা
if (btnSendResetOTP) {
    btnSendResetOTP.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = resetEmail?.value.trim().toLowerCase();
        if (!email) {
            if (forgotErrorTxt) forgotErrorTxt.innerText = "Please enter your email.";
            return;
        }

        btnSendResetOTP.innerText = "Sending...";
        btnSendResetOTP.disabled = true;

        try {
            const response = await fetch('http://127.0.0.1:5000/api/forgot-password/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Failed to send OTP.");
            }

            currentResetUID = result.uid; // ব্যাকএন্ড থেকে আসা UID সংরক্ষণ করা হলো

            if (forgotErrorTxt) forgotErrorTxt.innerText = "OTP sent to your email!";
            if (resetOtpArea) resetOtpArea.style.display = "block";
            
        } catch (error) {
            console.error(error);
            if (forgotErrorTxt) forgotErrorTxt.innerText = error.message;
        } finally {
            btnSendResetOTP.innerText = "Send Recovery OTP";
            btnSendResetOTP.disabled = false;
        }
    });
}

// OTP ভেরিফাই করে পাসওয়ার্ড রিসেট করা
if (btnConfirmReset) {
    btnConfirmReset.addEventListener('click', async (e) => {
        e.preventDefault();
        const enteredOTP = resetOTP?.value.trim();
        const newPass = resetNewPass?.value;

        if (!enteredOTP || !newPass || newPass.length < 6) {
            if (forgotErrorTxt) forgotErrorTxt.innerText = "Enter valid OTP and New Password (min 6 chars).";
            return;
        }

        if (!currentResetUID) {
            if (forgotErrorTxt) forgotErrorTxt.innerText = "Session expired. Please request OTP again.";
            return;
        }

        btnConfirmReset.innerText = "Verifying...";
        btnConfirmReset.disabled = true;

        try {
            const response = await fetch('http://127.0.0.1:5000/api/forgot-password/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uid: currentResetUID,
                    enteredOTP: enteredOTP,
                    newPass: newPass
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Failed to reset password.");
            }

            alert("Password reset successfully! You can now login.");
            
            if (forgotModal) {
                forgotModal.classList.remove("show");
                setTimeout(() => { forgotModal.style.display = 'none'; }, 300);
            }
            if (resetOtpArea) resetOtpArea.style.display = 'none';
            if (resetEmail) resetEmail.value = '';
            if (resetOTP) resetOTP.value = '';
            if (resetNewPass) resetNewPass.value = '';
            if (forgotErrorTxt) forgotErrorTxt.innerText = '';
            currentResetUID = null;

        } catch (error) {
            console.error(error);
            if (forgotErrorTxt) forgotErrorTxt.innerText = error.message;
        } finally {
            btnConfirmReset.innerText = "Confirm Password";
            btnConfirmReset.disabled = false;
        }
    });
}
</script>
